<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#7ed1f5"/>
  <title>Quantos Caras? — How Many Dudes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
  <main id="app-shell" aria-label="Quantos Caras">
    <div id="game" aria-label="Jogo Quantos Caras"></div>
    <section id="loading-screen" aria-live="polite">
      <div class="loading-card">
        <div class="loading-card__mark" aria-hidden="true"></div>
        <h1>QUANTOS<br/>CARAS?</h1>
        <p>Preparando o rancho...</p>
        <div class="loading-card__track" aria-hidden="true"></div>
      </div>
    </section>
    <section id="rotate-gate" aria-live="polite">
      <div class="rotate-card">
        <div class="rotate-card__phone" aria-hidden="true"></div>
        <h2>VIRE O CELULAR</h2>
        <p>O rancho é largo. Deite o telefone para ver o campo inteiro.</p>
      </div>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
